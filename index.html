<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes frontend using the JSONPlaceholder public API">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>QuickNotes</h1>
      <p>A notes client using a public HTTP API</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Create a note</h2>

      <form id="note-form">
        <label for="title-input">Title</label>
        <input
          id="title-input"
          name="title"
          type="text"
          maxlength="100"
          required
          placeholder="Enter your note title"
        >

        <label for="body-input">Content (optional)</label>
        <textarea
          id="body-input"
          name="body"
          rows="4"
          placeholder="Write your note (optional)"
        ></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Notes</h2>
        <button id="load-btn" class="secondary" type="button">
          Load / Refresh notes
        </button>
      </div>

      <p id="status" role="status" aria-live="polite">
        Ready to connect to JSONPlaceholder.
      </p>

      <ul id="notes-list" class="notes-list"></ul>
    </section>
  </main>

  <footer class="container footer">
    <p>PLP Web Foundations — QuickNotes System Design</p>
  </footer>
</body>
</html>
