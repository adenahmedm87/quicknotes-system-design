<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes API client">
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Notes API Client</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Create a note</h2>

      <form id="note-form">
        <label for="note-title">Title</label>
        <input
          id="note-title"
          name="title"
          type="text"
          maxlength="100"
          required
          placeholder="Enter your note title"
        >

        <label for="note-content">Content</label>
        <textarea
          id="note-content"
          name="content"
          rows="4"
          required
          placeholder="Write your note"
        ></textarea>

        <label for="note-tags">Tags (separated by commas)</label>
        <input
          id="note-tags"
          name="tags"
          type="text"
          placeholder="study, personal"
        >

        <button id="create-button" type="submit">Create note</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Your notes</h2>
        <button id="refresh-button" class="secondary" type="button">
          Refresh
        </button>
      </div>

      <p id="status" role="status" aria-live="polite">
        Ready to connect to the API.
      </p>

      <ul id="notes-list" class="notes-list"></ul>
    </section>
  </main>

  <footer class="container footer">
    <p>PLP Web Foundations — QuickNotes System Design</p>
  </footer>
</body>
</html>
